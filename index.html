<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇬🇧</text></svg>">
    <title>ИИ Тренажер Английского</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* ================= ФОН ================= */
        body {
            margin: 0;
            padding: 20px 10px;
            font-family: system-ui, -apple-system, sans-serif;
            color: #eee;
            display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;
            align-items: flex-start;
            min-height: 100vh;
            background-color: #1a1a2e;
            position: relative;
            overflow-x: hidden;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            transition: transform 0.2s ease-out;
            transform-origin: top center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(26, 26, 46, 0.85); /* Синеватое затемнение */
            z-index: -1;
            pointer-events: none;
        }

        /* Стили интерфейса */
        .card {
            background: rgba(30, 30, 50, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 500px;
        }

        .card-header { margin: 0 0 12px; font-size: 18px; color: #fff; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .icon-btn { cursor: pointer; font-size: 22px; background: none; border: none; padding: 0; color: #eee; }
        .icon-btn:active { transform: scale(0.9); }

        /* Ввод текста */
        #mainInput {
            width: 100%; min-height: 100px; padding: 12px; font-size: 16px;
            border-radius: 8px; border: 1px solid #333; background: #0f0f1a; color: #eee;
            resize: vertical; font-family: inherit;
        }
        #mainInput:focus { outline: none; border-color: #e63946; }

        .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .btn-primary { flex: 1; padding: 14px; background: #e63946; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; }
        .btn-secondary { padding: 14px; background: #457b9d; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; }
        .btn-outline { padding: 14px; background: #333; color: #fff; border: none; border-radius: 8px; font-size: 15px; }

        #resultBox {
            margin-top: 15px; padding: 15px; background: rgba(15, 15, 26, 0.9); border-radius: 8px;
            font-size: 15px; line-height: 1.6; min-height: 60px; color: #ddd;
            font-family: inherit; white-space: pre-wrap;
            max-height: 400px; overflow-y: auto;
        }
        #resultBox .err { color: #ff6b6b; }
        #resultBox .ai-label { color: #a8dadc; font-weight: bold; margin-bottom: 8px; display: block; border-bottom: 1px solid #333; padding-bottom: 5px; }

        /* Теги быстрых действий */
        .quick-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .tag { background: #2b2b40; color: #ccc; border: none; padding: 8px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; }
        .tag:active { background: #457b9d; color: #fff; }

        /* Модалки */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 100; justify-content: center; align-items: center; padding: 15px; }
        .modal.show { display: flex; }
        .modal-box { background: #1e1e32; padding: 20px; border-radius: 12px; width: 100%; max-width: 450px; border: 1px solid #333; display: flex; flex-direction: column; max-height: 90vh; }
        .modal-box h3 { margin: 0 0 16px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; color: #fff; }
        .modal-box h3 span.close { cursor: pointer; color: #888; font-size: 24px; }
        
        .setting-group { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #333; }
        .setting-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .setting-group label { display: block; font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .setting-group input[type="password"] { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #0f0f1a; color: #eee; font-family: monospace; font-size: 14px; }
        .setting-group button { width: 100%; padding: 12px; border-radius: 6px; border: none; font-size: 15px; background: #457b9d; color: #fff; }
        .note { font-size: 12px; color: #888; margin-top: 8px; }
        .note a { color: #a8dadc; }
    </style>
</head>
<body>

    <!-- БЛОК 1: ПЕРЕВОДЧИК -->
    <div class="card">
        <div class="card-header">
            <span>📖 Переводчик и разбор</span>
            <button class="icon-btn" id="openSettings">⚙️</button>
        </div>
        <div class="quick-tags">
            <button class="tag" onclick="setPrompt('Переведи этот текст на русский и сделай грамматический разбор:\n\n')">Перевод + Грамматика</button>
        </div>
        <textarea id="translateInput" placeholder="Вставь сюда текст на английском..."></textarea>
        <div class="row">
            <button class="btn-primary" onclick="aiTranslate()">Перевести</button>
            <button class="btn-outline" onclick="document.getElementById('translateInput').value=''">Очистить</button>
        </div>
        <div id="translateResult" style="display:none; margin-top: 15px; padding: 15px; background: rgba(15, 15, 26, 0.9); border-radius: 8px; font-size: 15px; line-height: 1.6; white-space: pre-wrap;"></div>
    </div>

    <!-- БЛОК 2: ИИ-РЕПЕТИТОР -->
    <div class="card">
        <div class="card-header">
            <span>🤖 ИИ-Репетитор</span>
        </div>
        <div class="quick-tags">
            <button class="tag" onclick="setPrompt('Проверь мой текст на ошибки и объясни их. Вот текст:\n\n')">Проверка ошибок</button>
            <button class="tag" onclick="setPrompt('Объясни правило Present Perfect простыми словами. Приведи 3 примера.')">Present Perfect</button>
            <button class="tag" onclick="setPrompt('Составь тест из 5 вопросов на тему Past Simple с вариантами ответов.')">Тест: Past Simple</button>
        </div>
        <textarea id="aiInput" placeholder="Спроси о грамматике, попроси проверить текст или составить тест..."></textarea>
        <div class="row">
            <button class="btn-primary" style="background:#a3a;" onclick="aiAsk()">Спросить ИИ</button>
            <button class="btn-outline" onclick="document.getElementById('aiInput').value=''">Очистить</button>
        </div>
        <div id="aiResult" style="display:none; margin-top: 15px; padding: 15px; background: rgba(15, 15, 26, 0.9); border-radius: 8px; font-size: 15px; line-height: 1.6; white-space: pre-wrap;"></div>
    </div>

    <!-- МОДАЛКА НАСТРОЕК -->
    <div class="modal" id="settingsModal">
        <div class="modal-box">
            <h3>⚙️ Настройки <span class="close" onclick="closeSettings()">✕</span></h3>
            
            <div class="setting-group">
                <label>🔍 Масштаб интерфейса</label>
                <input type="range" id="zoomRange" min="80" max="150" value="100" step="5" style="width: 100%; margin-bottom: 5px;">
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: #666;">
                    <span>Маленький</span>
                    <span id="zoomValue">100%</span>
                    <span>Большой</span>
                </div>
            </div>

            <div class="setting-group">
                <label>🤖 OpenRouter API Key</label>
                <input type="password" id="apiKeyInput" placeholder="sk-or-v1-...">
                <div class="note">Ключ бесплатный: <a href="https://openrouter.ai/keys" target="_blank">openrouter.ai/keys</a>.</div>
            </div>
            <button onclick="saveSettings()" style="background: #e63946; padding: 12px; border-radius: 6px; border: none; color: #fff; font-size: 15px; margin-top: 10px; font-weight: bold;">Сохранить</button>
        </div>
    </div>

    <script>
        // ================= НАСТРОЙКИ =================
        const settingsModal = document.getElementById('settingsModal');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const zoomRange = document.getElementById('zoomRange');
        const zoomValue = document.getElementById('zoomValue');

        function applyZoom(percent) {
            document.body.style.zoom = percent + '%';
            zoomValue.textContent = percent + '%';
            localStorage.setItem('custom_zoom', percent);
        }

        zoomRange.oninput = (e) => applyZoom(e.target.value);

        function initSettings() {
            const savedKey = localStorage.getItem('openrouter_key');
            const savedZoom = localStorage.getItem('custom_zoom');
            if (savedKey) apiKeyInput.value = savedKey;
            if (savedZoom !== null) { zoomRange.value = savedZoom; applyZoom(savedZoom); }
        }
        initSettings();

        document.getElementById('openSettings').onclick = () => settingsModal.classList.add('show');
        window.closeSettings = () => settingsModal.classList.remove('show');
        settingsModal.onclick = e => { if (e.target === settingsModal) closeSettings(); };

        window.saveSettings = () => {
            const key = apiKeyInput.value.trim();
            if (key) localStorage.setItem('openrouter_key', key);
            else localStorage.removeItem('openrouter_key');
            closeSettings();
        };

        function getApiKey() { return localStorage.getItem('openrouter_key') || ''; }

        // ================= ВСПОМОГАТЕЛЬНЫЕ =================
        function setPrompt(text) {
            // Находим активное текстовое поле (в котором сейчас курсор) или просто кидаем в ИИ
            const aiInput = document.getElementById('aiInput');
            aiInput.value = text;
            aiInput.focus();
        }

        async function callAI(systemPrompt, userText, resultElement, isTranslate = false) {
            const key = getApiKey();
            if (!key) {
                if (confirm('Нужен API-ключ. Открыть настройки?')) settingsModal.classList.add('show');
                return;
            }
            if (!userText.trim()) { alert('Введи текст!'); return; }

            resultElement.style.display = 'block';
            resultElement.innerHTML = '<span class="ai-label">🤖 Нейросеть думает…</span>';
            
            const models = ['meta-llama/llama-3.3-70b-instruct:free', 'qwen/qwen-2.5-72b-instruct:free', 'google/gemini-flash-1.5:free', 'deepseek/deepseek-chat'];
            let lastError = null;

            for (const model of models) {
                try {
                    const resp = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json', 'HTTP-Referer': location.href, 'X-Title': 'EnglishApp' },
                        body: JSON.stringify({
                            model: model,
                            messages: [
                                { role: 'system', content: systemPrompt },
                                { role: 'user', content: userText }
                            ], temperature: 0.2
                        })
                    });

                    if (resp.status === 429) { lastError = new Error(`${model} перегружена`); await new Promise(r => setTimeout(r, 1500)); continue; }
                    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                    
                    const data = await resp.json();
                    let text = data?.choices?.[0]?.message?.content;
                    
                    // Очистка от маркдауна
                    text = text.replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#{1,6}\s*/gm, '').replace(/```[\w]*\n?/g, '').replace(/```/g, '');
                    
                    resultElement.innerHTML = `<span class="ai-label">🤖 Ответ ИИ:</span>\n\n` + text;
                    return; // Успех, выходим
                } catch (err) { lastError = err; }
            }
            resultElement.innerHTML = '<span class="err">☹️ Все модели перегружены. Попробуй еще раз. Ошибка: ' + (lastError ? lastError.message : 'неизвестно') + '</span>';
        }

        // ================= ФУНКЦИИ КНОПОК =================
        
        // Перевод
        function aiTranslate() {
            const text = document.getElementById('translateInput').value;
            const resBox = document.getElementById('translateResult');
            const sysPrompt = "Ты профессиональный переводчик. Переведи текст на русский язык. Оформи ответ так:\n\nПеревод:\n(твой перевод)\n\nТранскрипция:\n(если это одно слово или короткая фраза, напиши транскрипцию)\n\nГрамматика:\n(объясни главные грамматические конструкции, которые использованы в тексте)";
            callAI(sysPrompt, 'Текст:\n' + text, resBox);
        }

        // ИИ-репетитор (свободный вопрос)
        function aiAsk() {
            const text = document.getElementById('aiInput').value;
            const resBox = document.getElementById('aiResult');
            const sysPrompt = "Ты — строгий, но добрый репетитор по английскому языку. Отвечай на русском языке. Если тебя просят проверить текст, найди ошибки, исправь их и объясни правило. Если просят объяснить правило — объясни простыми словами и дай 2-3 примера с переводом. Если просят тест — сделай 5 вопросов с вариантами ответов (A, B, C, D) и в самом конце дай правильные ответы. Пиши обычным текстом, без сложного форматирования и LaTeX.";
            callAI(sysPrompt, 'Запрос:\n' + text, resBox);
        }
    </script>
</body>
</html>
