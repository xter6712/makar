<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>cайт по кликанью</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2f6bc5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Привет! Я Макар</h1>
        <p>Это мой первый собственный сайт, созданный вручную.</p>
        <a href="https://t.me" class="btn">Написать мне</a>
    </div>
</body>
</html>
